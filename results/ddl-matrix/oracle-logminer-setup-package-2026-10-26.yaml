    level: warning
    message: FLOW_SCHEMA_CHANGED (WARN)
  - class: CDC_APPLIER_SCHEMA_CHANGED_DURING_STREAMING
    level: warning
    message: restart of the update)
  outcome: restart-no-full-refresh
  full_refresh_needed: false
  auto_full_refresh_applies: null
  destination_type_after: column C1 not present at last read
  post_change_row_landed: false
  value_check: row id 3 not present (count 2)
  basis: partial
  notes: the first restart applied no change to the destination.; restart event seen; destination not applied; run case c01
