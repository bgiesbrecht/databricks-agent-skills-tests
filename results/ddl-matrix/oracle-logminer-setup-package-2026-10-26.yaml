environment:
  engine: oracle
  product: Oracle AI Database 26ai Free
  edition_tier: Free; CDB FREE with pluggable database FREEPDB1
  version: Oracle AI Database 26ai Free Release 23.26.3.0.0
  mechanism: logminer
  setup: setup-package
  source_setup: Databricks Oracle setup package (a C## user with the grants it needs; no DDL-tracking objects); ARCHIVELOG; supplemental logging on the database and on primary keys; recovery area 50G (see
    caveats)
  pipeline_mode: integrated
  compute: serverless
  runtime:
    dbr_version: '18.3'
    channel: CURRENT
    image_key: dlt:18.3.8-delta-pipelines-aarch64-photon-dlt-release-dp-20261015-rc0-commit-48da011-image-5bafb35
    dp_build: dp-20261015-rc0
    cloud_region: AWS us-west-2
    basis: read from the SQL Server pipelines; the other runs used the same workspace the same day
  workspace:
    cloud: AWS
    region: us-west-2
  date: '2026-10-26'
  method: batch
  caveats:
  - The setup package creates no DDL-tracking objects (no triggers, tables, sequences or views); the DDL behavior comes from the LogMiner extractor's options, not from setup objects.
  - The DDL-capable LogMiner mode is inferred from behavior (FLOW_SCHEMA_CHANGED on compatible changes; the full-refresh error on a dropped primary key and on an added unique key). The pipeline settings
    were not read.
  - The recovery area filled at 10G while the archiver ran (ORA-19809, then ORA-00257). It was raised to db_recovery_file_dest_size 50G and the archiver was valid again.
  - After the first restart the extractor stalled, with lag growing for about 60 minutes. The rename-table, drop-primary-key and add-unique cases needed a full refresh; the rename table was refreshed under
    its old name and failed, the other two caught up.
  - After the catch-up the flow-schema-changed tables still showed their old shapes; their post-change rows had not landed at the last read (2026-10-27 00:48 UTC).
  - Drop table not run. The truncate update was still running at the last read, so its result is not final.
  - Cases c01 to c18 ran in one update; c19 and c20 in separate updates. The Oracle refusals are the source's own text.
