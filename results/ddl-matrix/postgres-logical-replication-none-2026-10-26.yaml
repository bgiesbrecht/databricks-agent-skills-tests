environment:
  engine: postgres
  product: Azure Database for PostgreSQL Flexible Server
  edition_tier: null
  version: '16.15'
  mechanism: logical-replication
  setup: none
  source_setup: none; the replication slot and publication were created by hand as the table owner (the gateway didn't create them)
  pipeline_mode: standard
  compute: serverless
  runtime:
    dbr: null
    channel: null
    image: null
  workspace:
    cloud: AWS
    region: us-west-2
  date: '2026-10-26'
  method: batch
  caveats:
  - 'All 19 DDLs and inserts ran as one batch, then one ingestion update. That update FAILED at analysis (9 tables with DDL_NOT_SUPPORTED). The next updates re-ran the snapshot of every table, so a row
    without an error class is confounded: basis confounded, row unverified.'
  - The initial update (before the DDL) COMPLETED. No full refresh was run.
cases:
- id: add-nullable
  ddl: ADD COLUMN c INT NULL (n integer; c integer added; id integer NOT NULL, PK kept)
  column_before: absent
  column_after: integer NULL
  source_accepted: true
  events:
  - class: INGESTION_GATEWAY_DDL_NOT_SUPPORTED.UNSUPPORTED_DDL
    level: error
    message: 'ManagedIngestionNonRetryableException INGESTION_GATEWAY_DDL_NOT_SUPPORTED.UNSUPPORTED_DDL "Schema change detected: Unable to parse a column : ''c'' in table : <database>.public.addnull"'
  outcome: table-stops-full-refresh
  full_refresh_needed: true
  auto_full_refresh_applies: null
  destination_type_after: null
  post_change_row_landed: false
  value_check: null
  basis: tested
  notes: 'recorded: update FAILED at analysis; ManagedIngestionNonRetryableException INGESTION_GATEWAY_DDL_NOT_SUPPORTED.UNSUPPORTED_DDL "Schema change detected: Unable to parse a column : ''c'' in table
    : <database>.public.addnull"; full refresh required (not run); row 3 not landed'
