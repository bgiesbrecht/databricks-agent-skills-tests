environment:
  product: Azure SQL Database
  edition_tier: serverless GP_S_Gen5_1
  version: Microsoft SQL Azure (RTM) - 12.0.2000.8 Oct 9 2026
  pipeline_mode: integrated
  compute: serverless
  runtime:
    dbr: null
    channel: null
    image: null
  workspace:
    cloud: AWS
    region: us-west-2
  date: '2026-10-26'
  engine: sqlserver
  mechanism: ct
  setup: none
  source_setup: 'none, manual grants: SELECT and VIEW CHANGE TRACKING on each table, VIEW DEFINITION, VIEW DATABASE STATE'
  method: batch
  caveats:
  - The update after the DDL burst FAILED at analysis because two source tables were missing; the post-change rows of the other tables after that point were not re-ingested.
cases:
- id: rename-column
  ddl: EXEC sp_rename 'dbo.k_rencol.n', 'n2', 'COLUMN' (int -> int, name n -> n2)
  column_before: INT (n)
  column_after: INT (n2)
  source_accepted: true
  events:
  - class: CDC_INCOMPATIBLE_SCHEMA_CHANGES.COLUMNS_ADDED_AND_DELETED
    level: error
    message: CDC_INCOMPATIBLE_SCHEMA_CHANGES.COLUMNS_ADDED_AND_DELETED, full refresh needed
  outcome: table-stops-full-refresh
  full_refresh_needed: true
  auto_full_refresh_applies: null
  destination_type_after: int
  post_change_row_landed: false
  value_check: null
  basis: tested
  notes: 'recorded: source OK; CDC_INCOMPATIBLE_SCHEMA_CHANGES.COLUMNS_ADDED_AND_DELETED, full refresh needed; destination still n int; post insert (id, n2, v) on source only, not ingested'
- id: rename-table
  ddl: EXEC sp_rename 'dbo.k_rentab', 'k_rentab_new'
  column_before: table name only
  column_after: table name only
  source_accepted: true
  events:
  - class: INGESTION_GATEWAY_MISSING_TABLE_IN_SOURCE
    level: error
    message: INGESTION_GATEWAY_MISSING_TABLE_IN_SOURCE (old name), full refresh needed
  outcome: table-stops-full-refresh
  full_refresh_needed: true
  auto_full_refresh_applies: null
  destination_type_after: null
  post_change_row_landed: false
  value_check: null
  basis: tested
  notes: 'recorded: source OK; INGESTION_GATEWAY_MISSING_TABLE_IN_SOURCE (old name), full refresh needed; destination k_rentab unchanged, no k_rentab_new; post insert not landed'
- id: drop-primary-key
  ddl: ALTER TABLE DROP CONSTRAINT pk_k_droppk
  column_before: no change (PRIMARY KEY dropped)
  column_after: no change (PRIMARY KEY dropped)
  source_accepted: 'Msg 3735: primary key cannot be dropped because change tracking is enabled'
  events: []
  outcome: not-applicable
  full_refresh_needed: null
  auto_full_refresh_applies: null
  destination_type_after: null
  post_change_row_landed: true
  value_check: landed
  basis: tested
  notes: 'recorded: refused by source, Msg 3735: primary key cannot be dropped because change tracking is enabled ("Change tracking requires a primary key constraint on the table"); no pipeline change;
    post insert (keyless shape not needed, PK intact) landed (1 row id 3); recorded as ''drop-pk-constraint'''
- id: add-unique
