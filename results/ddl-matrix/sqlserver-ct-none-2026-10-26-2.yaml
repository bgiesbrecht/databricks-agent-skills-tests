  column_before: no change (UNIQUE constraint)
  column_after: no change (UNIQUE constraint)
  source_accepted: true
  events: []
  outcome: no-interruption
  full_refresh_needed: false
  auto_full_refresh_applies: null
  destination_type_after: string
  post_change_row_landed: true
  value_check: post insert landed
  basis: tested
  notes: 'recorded: source OK; no pipeline error event; no restart reported in the final update; destination types unchanged (int, string); post insert landed (1 row id 3); recorded as ''add-unique-constraint'''
