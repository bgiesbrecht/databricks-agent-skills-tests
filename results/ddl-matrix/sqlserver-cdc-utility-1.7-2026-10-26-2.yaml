    level: warning
    message: update restarted
  outcome: restart-no-full-refresh
  full_refresh_needed: false
  auto_full_refresh_applies: null
  destination_type_after: c int
  post_change_row_landed: true
  value_check: new row landed (1 row id 3)
  basis: tested
  notes: carried from sqlserver-cdc-2026-10-26.yaml; recorded as 'add-nullable-keyed'
