  date: '2026-10-26'
  method: batch
  mechanism: cdc
  setup: utility-1.7
  source_setup: 'utility script 1.7 (published): lakeflowSetupChangeDataCapture for the test tables, then lakeflowFixPermissions'
  caveats:
  - The pipeline is integrated with continuous false (triggered). The runtime_details event carries no DBR version, channel or image.
