environment:
  engine: postgres
  product: Azure Database for PostgreSQL Flexible Server
  edition_tier: null
  version: '16.15'
  mechanism: logical-replication
  pipeline_mode: standard
  compute: serverless
  runtime:
    dbr_version: '18.3'
    channel: CURRENT
    image_key: dlt:18.3.8-delta-pipelines-aarch64-photon-dlt-release-dp-20261015-rc0-commit-48da011-image-5bafb35
    dp_build: dp-20261015-rc0
    cloud_region: AWS us-west-2
    basis: read from the SQL Server pipelines; the other runs used the same workspace the same day
  workspace:
    cloud: AWS
    region: us-west-2
  date: '2026-10-26'
  method: one-case-at-a-time
  setup: ddl-objects-1.0
  source_setup: DDL support objects 1.0 (an audit table, two event-trigger functions and two event triggers; created as superuser by the admin; the audit table added to the publication) and inline DDL tracking
    enabled by Databricks support
  caveats:
  - Inline DDL tracking is documented as on hold for stabilization; it was enabled by Databricks support for this run. Documented setup steps were followed.
  - 'The audit table was added to the publication by a superuser: the publication owner''s ALTER PUBLICATION ... ADD TABLE fails with ''must be owner of table'' because the admin owns the audit table.'
  - 'One update per case. After a stopped update, a table-only full refresh before the next case. Rows that landed only after such a reset came from the snapshot, not CDC: they are marked post_change_row_landed
    false with the value check.'
  - 'Standard CDC: one gateway and one ingestion pipeline per group; triggered (continuous false). The pipelines API does not expose the runtime.'
