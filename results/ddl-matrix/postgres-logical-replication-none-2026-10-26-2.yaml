environment:
  engine: postgres
  product: Azure Database for PostgreSQL Flexible Server
  edition_tier: null
  version: '16.15'
  mechanism: logical-replication
  pipeline_mode: standard
  compute: serverless
  runtime:
    dbr: null
    channel: null
    image: null
  workspace:
    cloud: AWS
    region: us-west-2
  date: '2026-10-26'
  method: one-case-at-a-time
  setup: none
  source_setup: 'none: no DDL support objects; inline DDL tracking off (the default); the replication slot and the publication were created by hand as the documented steps'
  caveats:
  - 'Standard CDC: one gateway and one ingestion pipeline per group (main, rename-table, drop-table); triggered (continuous false). The pipelines API does not expose the runtime.'
  - 'One update per case. After a stopped update, a table-only full refresh before the next case. Rows that landed only after such a reset came from the snapshot, not CDC: they are marked post_change_row_landed
    false with the value check.'
  - Snapshot flows ran every update; they are no-ops without new snapshot files.
  - 'Silent results (no error): a scale widening keeps the destination scale and rounds the value; an added generated column is not replicated.'
cases:
- id: add-nullable
  ddl: ALTER TABLE addnull ADD COLUMN c INT NULL
  column_before: null
  column_after: null
  source_accepted: '{''ddl'': ''true'', ''insert'': ''true''}'
  events:
  - class: INGESTION_GATEWAY_DDL_NOT_SUPPORTED.UNSUPPORTED_DDL
    level: error
    message: INGESTION_GATEWAY_DDL_NOT_SUPPORTED.UNSUPPORTED_DDL
  - class: PIPELINE_NON_RETRYABLE_ANALYSIS_CLIENT_ERROR
    level: error
    message: PIPELINE_NON_RETRYABLE_ANALYSIS_CLIENT_ERROR
  outcome: pipeline-fails
  full_refresh_needed: true
  auto_full_refresh_applies: null
  destination_type_after: absent
  post_change_row_landed: false
  value_check: landed by snapshot after the table reset (not CDC)
  basis: tested
  notes: 'standard: update FAILED at analysis; row 3 not in dest; full refresh of the table then loaded row 3 via snapshot (c=33); run case 1'
