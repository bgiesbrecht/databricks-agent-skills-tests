  - class: CDC_INCOMPATIBLE_SCHEMA_CHANGES.ADD_COLUMN_WITH_BACKFILL
    level: error
    message: ERROR CDC_INCOMPATIBLE_SCHEMA_CHANGES.ADD_COLUMN_WITH_BACKFILL
  outcome: table-stops-full-refresh
  full_refresh_needed: true
  auto_full_refresh_applies: null
  destination_type_after: c int
  post_change_row_landed: false
  value_check: 'after reset: all 3 rows c=5'
  basis: tested
  notes: snapshot after reset; run case c03_add_nn_default
