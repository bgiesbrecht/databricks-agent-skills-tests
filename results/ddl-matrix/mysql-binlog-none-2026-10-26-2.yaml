    message: 'flow terminated: schema change, new update will start'
  outcome: restart-no-full-refresh
  full_refresh_needed: false
  auto_full_refresh_applies: null
  destination_type_after: v string (kept in destination, not dropped)
  post_change_row_landed: true
  value_check: row 3 landed with v=NULL; rows 1-2 keep v='a','b'
  basis: tested
  notes: destination keeps the dropped column; no data loss; run case c06_drop_col
