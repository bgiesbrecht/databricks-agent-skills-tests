environment:
  engine: mysql
  product: Azure Database for MySQL Flexible Server
  edition_tier: null
  version: 8.0.46-azure
  mechanism: binlog
  setup: none
  source_setup: 'none: MySQL has no Lakeflow setup or DDL support objects; the binlog is the DDL source; the connector''s user authenticates with caching_sha2_password'
  pipeline_mode: integrated
  compute: serverless
  runtime:
    dbr: null
    channel: null
    image: null
  workspace:
    cloud: AWS
    region: us-west-2
  date: '2026-10-26'
  method: batch
  caveats:
  - 'One DDL batch, one table per case; stopped tables were reset with a table-only full refresh. Rows that landed only after a reset came from the snapshot, not CDC: they are marked post_change_row_landed
    false with the value check.'
  - The connection needs trustServerCertificate=true; without it the gateway fails TLS validation (TLS_VALIDATION_FAILURE).
  - The connector's user needs caching_sha2_password; with mysql_native_password the pipeline fails with CDC_NOT_ENABLED.
  - 'Silent type changes (no error): DATETIME to DATETIME(6) and DATE to DATETIME land as strings. No row is lost.'
  - A dropped column stays in the destination.
  - 'RENAME TABLE and DROP TABLE ran in their own pipelines. Server options: sql_generate_invisible_primary_key OFF, require_secure_transport ON, binlog_row_image FULL.'
  - The runtime is not recorded (the runtime event has no DBR fields). Standard CDC (gateway) was not run.
cases:
- id: add-nullable
  ddl: ALTER TABLE c01_add_null ADD COLUMN c INT NULL; INSERT (3,30,'c',7)
  column_before: no column c
  column_after: c INT NULL
  source_accepted: true
  events:
  - class: null
    level: error
    message: no schema-change warning or error on this table's flows
  outcome: no-interruption
  full_refresh_needed: false
  auto_full_refresh_applies: null
  destination_type_after: c int
  post_change_row_landed: true
  value_check: row 3 c=7; rows 1-2 c=NULL
  basis: tested
  notes: CDC row; run case c01_add_null
- id: add-nullable-with-default
  ddl: ALTER TABLE c02_add_default ADD COLUMN c INT DEFAULT 5; INSERT (3,30,'c') without c
  column_before: no column c
  column_after: c INT DEFAULT 5
  source_accepted: true
  events:
  - class: null
    level: warning
    message: 'flow terminated: schema change, new update will start'
  - class: CDC_INCOMPATIBLE_SCHEMA_CHANGES.ADD_COLUMN_WITH_BACKFILL
    level: error
    message: applier flow failed)
  outcome: table-stops-full-refresh
  full_refresh_needed: true
  auto_full_refresh_applies: null
  destination_type_after: c int
  post_change_row_landed: false
  value_check: 'after table reset: all 3 rows c=5 (default applied to old rows too)'
  basis: tested
  notes: 'rows landed only after the reset: snapshot, not CDC; run case c02_add_default'
