# Documented limits: cockroachdb-yugabytedb-debezium-kafka. Each quote is on its page: check with scripts/limits-check.py.
- product: CockroachDB
  limit: row size (error threshold)
  value: 80 MiB
  kind: configurable
  setting: sql.guardrails.max_row_size_err
  url: https://www.cockroachlabs.com/docs/stable/cluster-settings
  quote: maximum size of row (or column family if multiple column families are in use) that SQL can write to the database, above which an error is returned; use 0 to disable
  ask: any rows over 80 MiB (large JSON, blobs)?
  checked: 2026-10-22
