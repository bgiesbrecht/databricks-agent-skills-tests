  kind: soft
  note: 'raised on request through the Databricks account team (Fixed: No)'
  url: https://docs.databricks.com/aws/en/resources/limits
  quote: Unity Catalog | Table | 10,000 | Schema | No
  ask: more than about 5,000 source tables into one schema (each makes 2 silver tables)? split schemas, or ask the account team to raise it
