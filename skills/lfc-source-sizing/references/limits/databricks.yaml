- product: Lakeflow Connect PostgreSQL
  limit: Tables per pipeline with same name
  value: 0 (not allowed)
  kind: behavior
  url: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/postgresql-limits
  quote: Databricks can't ingest two or more tables with the same name in the same pipeline, even if they come from different source schemas
  ask: do several source schemas share table names? they need separate pipelines
  checked: '2026-10-22'
- product: Lakeflow Connect PostgreSQL
  limit: Replication slots management
  value: manual cleanup required
  kind: behavior
  url: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/postgresql-limits
  quote: Replication slots are not automatically removed when you delete pipelines. You must manually clean up replication slots to prevent WAL accumulation
  ask: who removes the slot when a pipeline is deleted? an orphaned slot keeps WAL growing
  checked: '2026-10-22'
- product: Lakeflow Connect PostgreSQL
  limit: Failover recovery requirement
  value: full refresh required
  kind: behavior
  url: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/postgresql-limits
  quote: If the primary PostgreSQL node is demoted or replaced (for example, during a failover), the replication slot information is lost. This results in a slot not found error that requires a full refresh
    of all tables in the pipeline
  ask: does the source fail over (HA, managed service)? a failover means a full refresh of the pipeline's tables
  checked: '2026-10-22'
- product: Lakeflow Connect PostgreSQL
  limit: Replica identity requirement
  value: FULL or DEFAULT required
  kind: behavior
  url: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/postgresql-limits
  quote: Each table that you replicate must have its replica identity set to FULL or DEFAULT. Databricks recommends using FULL replica identity for tables without primary keys or with TOASTable columns
  ask: which tables have no primary key, or TOASTed columns? set REPLICA IDENTITY FULL
  checked: '2026-10-22'
- product: Lakeflow Connect PostgreSQL
  limit: New column backfill
  value: not automatic
  kind: behavior
  url: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/postgresql-limits
  quote: If you select a column after a pipeline has already started, the connector does not automatically backfill data for the new column. To ingest historical data, manually run a full refresh on the
    table
  ask: are columns added often? historical values need a full refresh of the table
  checked: '2026-10-22'
- product: Lakeflow Connect PostgreSQL
  limit: Cursor columns requirement
  value: monotonically increasing
  kind: behavior
  url: https://docs.databricks.com/aws/en/ingestion/lakeflow-connect/postgresql-limits
  quote: The source system assumes that the cursor columns are monotonically increasing
  ask: 'query-based: which column only ever increases (updated_at, an ID)?'
  checked: '2026-10-22'
