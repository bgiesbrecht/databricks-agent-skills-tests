# Documented limits: databricks. Each quote is on its page: check with scripts/limits-check.py.
- product: Databricks
  limit: Unity Catalog tables per metastore
  value: 1,000,000
  kind: hard
  url: https://docs.databricks.com/aws/en/resources/limits
  quote: Unity Catalog | Table | 1,000,000 | Metastore | Yes
  ask: how many tables in total across every source and silver/gold?
  checked: '2026-10-22'
- product: Databricks
  limit: Unity Catalog tables per schema
